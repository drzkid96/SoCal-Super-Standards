name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import LA Bureau of Engineering Street Design Manual
        run: |
          python -m pip install lxml
          python pipeline/import_boe.py
      - uses: withastro/action@v3
        with:
          node-version: 22
      - name: Verify JS syntax, internal links, and bike citations
        run: |
          node pipeline/test_calculations.mjs
          for f in public/js/*.js; do node --check "$f"; done
          python3 -I pipeline/check_links.py
          python3 -I pipeline/check_bike_refs.py
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
