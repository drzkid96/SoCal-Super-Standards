name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .boe-cache
          key: boe-city-pages-${{ github.run_id }}
          restore-keys: |
            boe-city-pages-
      - name: Import LA Bureau of Engineering Street Design Manual
        run: |
          python -m pip install lxml
          find .boe-cache -name '*.html' -mtime +7 -delete 2>/dev/null || true
          python pipeline/import_boe.py --use-snapshot-on-network-error
      - uses: actions/upload-artifact@v4
        with:
          name: boe-street-design-source
          path: |
            src/content/docs/boe/street-design
            public/data/boe-sections.json
      - uses: actions/cache@v4
        with:
          path: .fhwa-releases
          key: fhwa-layouts-${{ hashFiles('pipeline/render_fhwa_sheets.py') }}
      - name: Prepare FHWA dimensioned layouts
        run: |
          python -m pip install pymupdf pillow
          python pipeline/render_fhwa_sheets.py .fhwa-releases
      - uses: actions/cache@v4
        with:
          path: .manual-art
          key: manual-art-v1-${{ hashFiles('data/reference/manual-illustrations.json') }}
      - name: Render original MUTCD charts and tables
        run: python pipeline/manual_art.py
      - uses: withastro/action@v3
        with:
          node-version: 22
      - name: Verify JS syntax, internal links, and bike citations
        run: |
          node pipeline/test_calculations.mjs
          for f in public/js/*.js; do node --check "$f"; done
          python3 -I pipeline/check_links.py
          python3 -I pipeline/check_bike_refs.py
          python pipeline/check_reader.py
      - name: Test desktop and mobile sheet navigation
        run: |
          python -m pip install selenium
          python pipeline/test_sheet_viewer.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
