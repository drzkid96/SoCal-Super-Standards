name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    concurrency:
      group: standards-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .boe-cache
          key: boe-city-pages-${{ github.run_id }}
          restore-keys: |
            boe-city-pages-
      - name: Import LA Bureau of Engineering Street Design Manual
        run: |
          python -m pip install lxml
          find .boe-cache -name '*.html' -mtime +7 -delete 2>/dev/null || true
          python pipeline/import_boe.py --use-snapshot-on-network-error
      - uses: actions/upload-artifact@v4
        with:
          name: boe-street-design-source
          path: |
            src/content/docs/boe/street-design
            public/data/boe-sections.json
      - uses: actions/cache@v4
        with:
          path: .fhwa-releases
          key: fhwa-layouts-${{ hashFiles('pipeline/render_fhwa_sheets.py') }}
      - name: Prepare FHWA dimensioned layouts
        run: |
          python -m pip install pymupdf pillow
          python pipeline/render_fhwa_sheets.py .fhwa-releases
      - uses: actions/cache@v4
        with:
          path: .manual-art
          key: manual-art-v1-${{ hashFiles('data/reference/manual-illustrations.json') }}
      - name: Render original MUTCD charts and tables
        run: python pipeline/manual_art.py
      - uses: actions/cache@v4
        with:
          path: .santa-monica-art
          key: santa-monica-ttcp-${{ hashFiles('pipeline/santa_monica_art.py') }}
      - name: Render Santa Monica original TTCP documents
        run: python pipeline/santa_monica_art.py
      - uses: actions/cache/restore@v4
        id: geography
        with:
          path: public/api/v2
          key: socal-geography-v2-${{ hashFiles('pipeline/atlas/*.py', 'data/reference/atlas/tiger-2025.json', 'data/reference/atlas/hpms-2024-ca.json', 'data/reference/atlas/pasadena-streets.geojson.gz', 'public/js/atlas/land.geojson') }}
      - name: Build the public geographic databases
        if: steps.geography.outputs.cache-hit != 'true'
        run: |
          command -v ogr2ogr >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y gdal-bin)
          python -m pip install 'pyshp==2.3.1' 'shapely>=2,<3'
          python pipeline/atlas/compile.py
      - uses: actions/cache/save@v4
        if: steps.geography.outputs.cache-hit != 'true'
        with:
          path: public/api/v2
          key: ${{ steps.geography.outputs.cache-primary-key }}
      - name: Cache verified Riverside publisher edition
        uses: actions/cache@v4
        with:
          path: .transit-sources/riverside-transit.pdf
          key: riverside-edition-${{ hashFiles('data/reference/transit-editions.json') }}
      - uses: withastro/action@v3
        with:
          node-version: 22
      - name: Verify JS syntax, internal links, and bike citations
        run: |
          node pipeline/test_calculations.mjs
          for f in public/js/*.js public/js/atlas/*.js; do node --check "$f"; done
          python3 -I pipeline/check_links.py
          python3 pipeline/check_printed_citations.py
          python3 -I pipeline/check_bike_refs.py
          python pipeline/check_reader.py
      - name: Test desktop and mobile sheet navigation and municipal map
        run: |
          node pipeline/test_atlas_worker.mjs
          node pipeline/test_location_search.mjs
          node pipeline/test_cad_sign_catalog.mjs
          python pipeline/test_cad_downloads.py
          python -m pip install selenium
          python pipeline/test_sheet_viewer.py
          python pipeline/test_atlas_browser.py
          python pipeline/test_site_navigation.py
  deploy:
    concurrency:
      group: standards-pages-publish
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
